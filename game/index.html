<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Teluk Arun — Kisah Jalanan: game open-world kriminal orisinal. Jelajahi kota pesisir, curi mobil, hindari polisi, selesaikan 3 misi, kumpulkan koin Arun, dan kerja sebagai sopir taksi.">
<meta name="theme-color" content="#1a2a3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd32a'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' text-anchor='middle' fill='%23111'%3ETA%3C/text%3E%3C/svg%3E">
<title>Teluk Arun — Kisah Jalanan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2a3a; font-family: system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd32a; font-size: 20px; font-weight: 700; letter-spacing: 2px; z-index: 5;
    pointer-events: none;
  }
  #menu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(10, 40, 70, 0.88), rgba(200, 90, 20, 0.72));
    z-index: 10;
  }
  #menu .panel {
    max-width: 600px; margin: 16px; padding: 28px 32px; border-radius: 16px;
    background: rgba(8, 18, 30, 0.92); color: #f5f6fa; text-align: center;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 211, 42, 0.35);
  }
  #menu h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 3px; color: #ffd32a; }
  #menu .sub { margin: 0 0 14px; color: #ff9f43; font-weight: 700; letter-spacing: 1px; }
  #menu p { line-height: 1.55; font-size: 15px; }
  #menu ul { text-align: left; display: inline-block; line-height: 1.8; font-size: 14px; }
  #menu button {
    display: block; margin: 14px auto 0; padding: 13px 34px; font-size: 17px; font-weight: 800;
    letter-spacing: 1px; color: #111; background: #ffd32a; border: 0; border-radius: 10px; cursor: pointer;
  }
  #menu button:hover { background: #ffe45e; }
  #menu button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #menu button.ghost { background: transparent; color: #dfe6e9; border: 1px solid #636e72; font-size: 14px; padding: 9px 22px; }
  #menu .foot { font-size: 12px; color: #b2bec3; margin-top: 16px; }
  @media (max-width: 640px) {
    #menu h1 { font-size: 32px; }
    #menu .panel { padding: 20px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Teluk Arun: game open-world kriminal — jelajahi kota, curi mobil, hindari polisi, selesaikan misi, kumpulkan koin, kerja taksi"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="loading">MEMUAT TELUK ARUN…</div>
<div id="menu" role="dialog" aria-label="Menu game"></div>
<noscript><p style="color:#fff;padding:20px">Teluk Arun butuh JavaScript aktif untuk dimainkan.</p></noscript>
<script type="module" src="./src/main.js"></script>
<script>
  // Sembunyikan tulisan loading begitu modul utama jalan (atau gagal).
  window.addEventListener('load', function () {
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }, 600);
  });
</script>
</body>
</html>

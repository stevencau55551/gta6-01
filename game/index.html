<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teluk Arun — Kisah Jalanan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2a3a; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #menu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(10, 40, 70, 0.88), rgba(200, 90, 20, 0.72));
    z-index: 10;
  }
  #menu .panel {
    max-width: 560px; margin: 16px; padding: 28px 32px; border-radius: 16px;
    background: rgba(8, 18, 30, 0.92); color: #f5f6fa; text-align: center;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 211, 42, 0.35);
  }
  #menu h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 3px; color: #ffd32a; }
  #menu .sub { margin: 0 0 14px; color: #ff9f43; font-weight: 700; letter-spacing: 1px; }
  #menu p { line-height: 1.55; font-size: 15px; }
  #menu ul { text-align: left; display: inline-block; line-height: 1.8; font-size: 14px; }
  #menu button {
    display: block; margin: 14px auto 0; padding: 13px 34px; font-size: 17px; font-weight: 800;
    letter-spacing: 1px; color: #111; background: #ffd32a; border: 0; border-radius: 10px; cursor: pointer;
  }
  #menu button:hover { background: #ffe45e; }
  #menu button.ghost { background: transparent; color: #dfe6e9; border: 1px solid #636e72; font-size: 14px; padding: 9px 22px; }
  #menu .foot { font-size: 12px; color: #b2bec3; margin-top: 16px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Teluk Arun: game open-world kriminal — jelajahi kota, curi mobil, hindari polisi, selesaikan misi"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="menu" style="display:none"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
